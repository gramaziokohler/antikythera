[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# project info
# ============================================================================

[project]
name = "antikythera-sdk"
description = "An all knowing, all controlling, robotic and otherwise, process manager."
keywords = ["magic", "orchestrator", "fabrication", "robotics", "automation", "architecture", "distributed systems", "events"]
authors = [
    { name = "Gonzalo Casas", email = "casas@arch.ethz.ch" },
    { name = "Chen Kasirer", email = "kasirer@arch.ethz.ch" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# Everything needed to run an orchestrator and actors from Python code.
dependencies = [
    "asteval",
    "compas >=2,<3",
    "compas_eve >=2.4,<3",
    "compas_model",
    "compas_pb >=1.2,<2",
    "coolname",
    "importlib_metadata; python_version < '3.10'",
    "jsonschema",
    "mqtthandler",
    "packaging",
    "python-dotenv",
    "redis",
    "typing_extensions >=4.6; python_version < '3.11'",
    "watchdog",
]

[project.optional-dependencies]
# The HTTP API service (`antikythera` command) that the frontend talks to.
deployment = [
    "fastapi >=0.111,<1",
    "python-multipart",
    "uvicorn >=0.25,<1",
]
# The MCP server (`antikythera-mcp` command).
mcp = [
    "httpx",
    "mcp[cli] >=1.0,<2; python_version >= '3.10'",
]
# NATS transport and storage backend, an alternative to MQTT + Redis.
nats = [
    "nats-py >=2.6",
]
dev = [
    "antikythera-sdk[deployment,mcp,nats]",
    "build",
    "bump-my-version",
    "compas_invocations2[mkdocs] >=1.3",
    "fakeredis",
    "grpcio-tools",
    "invoke >=0.14",
    "pytest >=8",
    "pytest-randomly",
    "pyvis",
    "ruff",
    "twine",
]

[project.entry-points.'antikythera.actors']
system = 'antikythera_orchestrator.system_actors'
interaction = 'antikythera_actors.user_interaction'
io = 'antikythera_actors.io_actor'
reference = 'antikythera_actors.reference_actor'

[project.scripts]
antikythera = "antikythera_orchestrator.__main__:main"
antikythera-actors = "antikythera_actors.__main__:main"
antikythera-mcp = "antikythera_orchestrator.mcp_server:main"

[project.entry-points.'compas_pb.plugins']
serializers = 'antikythera.models.conversions'

[project.urls]
Homepage = "https://gramaziokohler.github.io/antikythera"
Documentation = "https://gramaziokohler.github.io/antikythera"
Repository = "https://github.com/gramaziokohler/antikythera"
Changelog = "https://github.com/gramaziokohler/antikythera/blob/main/CHANGELOG.md"
Issues = "https://github.com/gramaziokohler/antikythera/issues"
Forum = "https://forum.compas-framework.org/"

# ============================================================================
# setuptools config
# ============================================================================

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "antikythera.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.pyi", "*.proto", "*.schema.json"]

# ============================================================================
# testing
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/antikythera"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-glob=*.rst",
    "--tb=short",
    "--import-mode=importlib",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# release
# ============================================================================

[tool.bumpversion]
current_version = "0.5.1"
message = "Bump version to {new_version}"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "src/antikythera/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# linting and formatting
# ============================================================================

[tool.black]
extend-exclude = '(/[a-zA-Z\./]*[\s]?)'  # exclude everything, black should be removed..

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"
# protoc-generated modules are regenerated by `invoke pre-build`, not edited by hand.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["antikythera", "antikythera_actors", "antikythera_orchestrator"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
