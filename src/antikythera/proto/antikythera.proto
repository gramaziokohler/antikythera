syntax = "proto3";

package antikythera.v1;

import "google/protobuf/timestamp.proto";

import "compas_pb/generated/message.proto";

enum ExecutionMode {
  EXECUTION_MODE_EXCLUSIVE = 0;   // Default: Only one actor is allocated the task
  EXECUTION_MODE_COMPETITIVE = 1; // Multiple actors can run, first to finish wins
}

// Task assignment message sent by orchestrator to actors
message TaskAssignmentMessage {
  // Required: unique task identifier
  string id = 1;

  // Required: task type (determines which actor handles it)
  string type = 2;

  // Optional: task inputs from blueprint session data
  // Uses google.protobuf.Any to support type-safe COMPAS objects via compas_pb
  map<string, compas_pb.data.AnyData> inputs = 3;

  // Optional: expected output keys (for validation)
  repeated string output_keys = 4;

  // Optional: task-specific parameters (not from session data)
  // Uses google.protobuf.Any to support type-safe COMPAS objects via compas_pb
  map<string, compas_pb.data.AnyData> params = 5;

  // Optional: assignment timestamp
  google.protobuf.Timestamp timestamp = 6;

  // Optional: execution mode
  ExecutionMode execution_mode = 7;

  // Optional: additional task context map
  map<string, compas_pb.data.AnyData> context = 8;
}

// Task claim request sent by actors to orchestrator
message TaskClaimRequest {
  // Required: task identifier
  string task_id = 1;

  // Required: actor identifier
  string actor_id = 2;

  // Optional: claim timestamp
  google.protobuf.Timestamp timestamp = 3;
}

// Task allocation message sent by orchestrator to confirm task assignment
message TaskAllocationMessage {
  // Required: task identifier
  string task_id = 1;

  // Required: actor identifier allocated to the task
  string assigned_actor_id = 2;

  // Optional: allocation timestamp
  google.protobuf.Timestamp timestamp = 3;
}

// Task status update sent by actors when they start executing a task
message TaskStatusUpdateMessage {
  // Required: task identifier
  string id = 1;

  // Required: current task state (typically TASK_STATE_RUNNING when execution starts)
  TaskState state = 2;

  // Required: actor claiming or running the task
  string actor_id = 3;

  // Optional: any additional status data (e.g., progress)
  compas_pb.data.AnyData data = 4;

  // Optional: time the update was emitted
  google.protobuf.Timestamp timestamp = 5;
}

// Task completion message sent by actors to orchestrator
message TaskCompletionMessage {
  // Required: unique task identifier
  string id = 1;

  // Required: current task state
  TaskState state = 2;

  // Required: actor identifier who completed the task
  string actor_id = 3;

  // Optional: task outputs (only for succeeded tasks)
  // Uses google.protobuf.Any to support type-safe COMPAS objects via compas_pb
  map<string, compas_pb.data.AnyData> outputs = 4;

  // Optional: error information (required for failed tasks)
  TaskError error = 5;

  // Optional: message timestamp
  google.protobuf.Timestamp timestamp = 6;

  // Optional: task execution duration in milliseconds
  uint64 duration_ms = 7;
}

// Task completion acknowledgement sent by orchestrator after recording a completion
message TaskCompletionAckMessage {
  // Required: task identifier being acknowledged
  string id = 1;

  // Optional: final recorded state (SUCCEEDED / FAILED)
  TaskState state = 2;

  // Optional: actor whose completion was accepted
  string accepted_actor_id = 3;

  // Optional: time the orchestrator processed the completion
  google.protobuf.Timestamp timestamp = 4;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_READY = 2;
  TASK_STATE_RUNNING = 3;
  TASK_STATE_SUCCEEDED = 4;
  TASK_STATE_FAILED = 5;
}

message TaskError {
  string code = 1;
  string message = 2;
  // Error details as type-safe COMPAS object via compas_pb
  compas_pb.data.AnyData details = 3;
}
