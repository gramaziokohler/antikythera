# Auth-enabled nginx config for the Antikythera frontend.
#
# This is the base frontend nginx.conf plus an oauth2-proxy `auth_request` gate.
# It is mounted over /etc/nginx/conf.d/default.conf by docker-compose.auth.yml so
# that the SAME frontend image serves either with or without auth, depending only
# on which compose files are used. Do not bake auth logic into the base image.
#
# Flow: every human-facing request (/, /api, /mqtt) triggers an internal
# subrequest to oauth2-proxy (/oauth2/auth). If the session cookie is valid AND
# the email is on the allowlist, oauth2-proxy returns 202 and nginx serves the
# content. Browser documents redirect into login on 401; API and WebSocket
# requests retain 401. Dex is exposed on the same origin under /dex so its
# redirect/issuer URLs work behind the TLS terminator.

# The documented production topology terminates TLS before this container. The
# terminator MUST replace (not append to) X-Forwarded-Proto so clients cannot
# choose the external scheme themselves.
map $http_x_forwarded_proto $auth_forwarded_proto {
    default   $scheme;
    ~*^https$ https;
    ~*^http$  http;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Browser navigations should receive an actual redirect. API and WebSocket
    # requests deliberately keep their 401 so clients never receive HTML where
    # they expect JSON or an Upgrade response.
    location @oauth2_signin {
        return 302 /oauth2/start?rd=$auth_forwarded_proto://$http_host$request_uri;
    }

    # Public landing page used after oauth2-proxy clears its local session.
    # Upstream social-provider sessions are intentionally left untouched.
    location = /signed-out.html {
        try_files /signed-out.html =404;
    }

    # -----------------------------------------------------------------------
    # oauth2-proxy endpoints (login, callback, sign-in page, auth subrequest)
    # -----------------------------------------------------------------------
    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $auth_forwarded_proto;
        proxy_set_header X-Forwarded-Host        $http_host;
        proxy_set_header X-Auth-Request-Redirect $auth_forwarded_proto://$http_host$request_uri;
    }

    # Internal-only endpoint used by `auth_request` below. oauth2-proxy validates
    # the cookie and the allowlist here without proxying the request body.
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $auth_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # No request body / large headers needed for the auth check.
        proxy_set_header Content-Length   "";
        proxy_pass_request_body           off;
    }

    # -----------------------------------------------------------------------
    # Dex OIDC broker — same-origin so redirect URIs / issuer stay on <host>/dex
    # -----------------------------------------------------------------------
    location /dex/ {
        proxy_pass http://dex:5556;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $auth_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    # -----------------------------------------------------------------------
    # Protected: REST API (and SSE stream) → orchestrator
    # -----------------------------------------------------------------------
    location /api/ {
        auth_request /oauth2/auth;

        # Expose the authenticated identity to downstream (optional consumption
        # by FastAPI for session ownership / audit; ignored when auth is off).
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;

        proxy_pass http://orchestrator:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host                 $host;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $auth_forwarded_proto;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-User  $auth_user;

        # SSE stream needs buffering disabled and long timeouts.
        proxy_buffering    off;
        proxy_read_timeout 86400s;
    }

    # -----------------------------------------------------------------------
    # Protected: MQTT-over-WebSocket → broker
    # -----------------------------------------------------------------------
    location /mqtt {
        auth_request /oauth2/auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;

        proxy_pass http://mqtt-broker:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;
    }

    # -----------------------------------------------------------------------
    # Protected: SPA (static assets + client-side routing)
    # -----------------------------------------------------------------------
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;

        try_files $uri $uri.html $uri/ /index.html;
    }
}
