name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-change:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
    steps:
      - uses: compas-dev/compas-actions/release-check@v1
        id: release

  build:
    needs: release-change
    if: github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.14"]
        exclude:
          # macOS + 3.9 has never worked here. compas-actions.build@v5 skipped
          # this combination internally; ci@v1 has no such carve-out, so the
          # matrix has to state it.
          - os: macos-latest
            python: "3.9"

    steps:
      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: ${{ matrix.python }}
          management-tool: uv
          invoke-tasks: lint test
          run-prebuild: true

  network-backends:
    name: NATS and Zenoh backends
    needs: release-change
    if: github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true'
    runs-on: ubuntu-latest
    env:
      # The NATS and Zenoh tests skip without a server; here both are started, so they must run.
      NATS_TEST_REQUIRED: "1"
      ZENOH_TEST_REQUIRED: "1"
    steps:
      - name: Start a NATS server with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10 -js
          for attempt in $(seq 30); do
            nc -z 127.0.0.1 4222 && exit 0
            sleep 1
          done
          docker logs nats
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Start a Zenoh router with a storage
        run: |
          docker run -d --name zenoh -p 7447:7447 -v "$PWD/tests/zenoh-router.json5:/zenoh.json5" eclipse/zenoh:1.10.2 -c /zenoh.json5
          for attempt in $(seq 30); do
            nc -z 127.0.0.1 7447 && exit 0
            sleep 1
          done
          docker logs zenoh
          exit 1

      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: "3.12"
          management-tool: uv
          invoke-tasks: test
          run-prebuild: true

  create-assets:
    name: Verify asset generation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/release-assets@v1
        with:
          python-version: "3.12"
          management-tool: uv
          extras: dev
          invoke-tasks: create-class-assets
          paths: dist/proto/*.zip
          artifact-name: protobuf-test-assets
