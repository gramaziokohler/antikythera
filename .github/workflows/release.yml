name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: compas-dev/compas-actions/release-check@v1
        id: release

  build:
    needs: release
    if: needs.release.outputs.is-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.12']

    steps:
      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: ${{ matrix.python }}
          management-tool: uv
          invoke-tasks: lint test
          run-prebuild: true

  prepare:
    needs: [release, build]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/prepare-release@v1
        with:
          python-version: '3.12'
          management-tool: uv
          run-prebuild: true

  assets:
    name: Build schema and binding assets
    needs: release
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      # Antikythera owns antikythera.proto, so it publishes the schemas and the bindings
      # for every supported language, the same way compas_pb does for the COMPAS types.
      - uses: compas-dev/compas-actions/release-assets@v1
        with:
          python-version: '3.12'
          management-tool: uv
          extras: dev
          invoke-tasks: create-class-assets
          paths: dist/proto/*.zip

  publish:
    needs: [release, prepare]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antikythera-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  docker:
    name: Build and push Docker image
    needs: [release, build]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/antikythera
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: [release, publish, assets]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/github-release@v1
        with:
          github-token: ${{ github.token }}
          tag-name: ${{ needs.release.outputs.tag }}
          target: ${{ github.sha }}
          release-assets-artifact-name: github-release-assets

  docs:
    needs: [release, create-release]
    if: needs.release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/docs@v1
        with:
          deploy: true
          version: ${{ needs.release.outputs.version }}
          extras: dev
