site_name: Antikythera
site_url: https://gramaziokohler.github.io/antikythera/

repo_name: gramaziokohler/antikythera
repo_url: https://github.com/gramaziokohler/antikythera/
edit_uri: blob/main/docs/

copyright: Copyright &copy; 2026, ETH Zurich - Gramazio Kohler Research

extra:
  homepage: https://gramaziokohler.github.io/antikythera/
  version:
    provider: mike

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  logo: _images/compas_logo_white_transparent.png
  favicon: _images/compas_logo_white_transparent.png
  features:
    - content.code.copy
    - content.footnote.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/css/custom.css

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - footnotes
  - md_in_html
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: "¤"

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://compas.dev/compas/latest/objects.inv
          options:
            allow_inspection: true
            backlinks: false
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true
            docstring_style: numpy
            docstring_section_style: list
            filters: public
            group_by_category: true
            heading_level: 2
            inheritance_diagram_direction: TD
            inherited_members: false
            line_length: 88
            merge_init_into_class: true
            modernize_annotations: true
            parameter_headings: false
            preload_modules: [mkdocstrings, compas]
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_category_heading: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_modules: false
            show_if_no_docstring: false
            show_inheritance_diagram: false
            show_root_heading: true
            show_root_full_path: true
            show_signature: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            show_source: false
            show_submodules: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary:
              modules: false
            type_parameter_headings: true
            unwrap_annotated: true

nav:
  - Home: index.md
  - Get Started:
      - Concepts: concepts.md
      - Installation: installation.md
      - Examples: examples.md
  - Guides:
      - Writing blueprints: blueprints.md
      - Writing actors: actors.md
      - Embedding the orchestrator: embedding.md
      - Running on NATS: nats.md
      - Running on Zenoh: zenoh.md
  - Deployment:
      - Run with Docker: deployment/docker.md
      - Run on bare metal: deployment/bare-metal.md
  - API Reference:
      - api/index.md
      - Blueprints: api/blueprints.md
      - Actors: api/actors.md
      - Built-in actors: api/builtin-actors.md
      - Orchestrator: api/orchestrator.md
      - HTTP API: api/http-api.md
      - Storage: api/storage.md
      - Transports: api/transports.md
  - Other:
      - Changelog: changelog.md
      - License: license.md
